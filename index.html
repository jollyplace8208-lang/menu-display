<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">

<!-- ✅ 農曆庫 -->
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.min.js"></script>

<style>
body {
  width: 3840px;
  height: 2160px;
  margin: 0;
  font-family: "Microsoft JhengHei";
  background: #E8EDDE;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  padding: 80px 120px;
  color: #7A8B42;
}

.date {
  font-size: 150px;
  font-weight: bold;
}

.subtitle {
  font-size: 90px;
}

/* Holiday */
.holiday-title { font-size: 80px; }
.holiday-name { font-size: 120px; font-weight: bold; }
.zongzi { width: 200px; }

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 50px;
  padding: 40px 120px;
}

/* Cards */
.card {
  border-radius: 40px;
  padding: 70px;
  height: 1200px;
}

.white { background:#F2F2F2; color:#A48036; }
.green { background:#7A8B42; color:white; }

/* Text */
.title { font-size: 180px; }
.item { font-size: 100px; margin: 30px 0; }

/* Split */
.split { display:flex; flex-direction:column; }
.top { background:#F2F2F2; color:#A48036; border-radius:40px; padding:60px; margin-bottom:30px;}
.bottom { background:#7A8B42; color:white; border-radius:40px; padding:60px; flex:1; }

</style>
</head>

<body>

<div class="header">
  <div>
    <div id="date" class="date"></div>
    <div class="subtitle">是日餐譜</div>
  </div>

  <div>
    <div class="holiday-title">下一個節日：</div>
    <div id="holiday" class="holiday-name"></div>
    <img class="zongzi" src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png">
  </div>
</div>

<div class="grid">

  <div class="card white">
    <div class="title">早餐</div>
    <div id="breakfast"></div>
  </div>

  <div class="card green">
    <div class="title">午餐</div>
    <div id="lunch"></div>
  </div>

  <div class="split">
    <div class="top">
      <div class="title">下午茶</div>
      <div id="tea"></div>
    </div>
    <div class="bottom">
      <div class="title">湯</div>
      <div id="soup"></div>
    </div>
  </div>

  <div class="card green">
    <div class="title">晚餐</div>
    <div id="dinner"></div>
  </div>

</div>

<script>

/* ✅ 日期 */
const today = new Date();
const days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
document.getElementById("date").innerText =
  `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')} ${days[today.getDay()]}`;

/* ✅ 農曆節日（準確） */
const solar = Solar.fromDate(today);
const lunar = solar.getLunar();
const festivals = solar.getFestivals(); // 公曆
const lunarFestivals = lunar.getFestivals(); // 農曆

let holiday = "";

if (lunarFestivals.length > 0) {
  holiday = lunarFestivals[0];
} else if (festivals.length > 0) {
  holiday = festivals[0];
} else {
  holiday = "—";
}

document.getElementById("holiday").innerText = holiday;

/* ✅ 讀 Google Sheets */
fetch("https://docs.google.com/spreadsheets/d/1-sqkIZbALnSUV8LpjTBLDey8_rIDJ8KU/gviz/tq?tqx=out:json&gid=1949007468")
.then(res => res.text())
.then(text => {

  const json = JSON.parse(text.substring(47).slice(0,-2));
  const rows = json.table.rows;

  function get(colIndex) {
    return rows.map(r => r.c[colIndex]?.v || "").filter(v => v);
  }

  render("breakfast", get(0));
  render("lunch", get(1));
  render("tea", get(2));
  render("soup", get(3));
  render("dinner", get(4));
});

/* render */
function render(id, arr) {
  document.getElementById(id).innerHTML =
    arr.map(i => `<div class="item">${i}</div>`).join('');
}

</script>

</body>
</html>
